  <body>
    <!-- SPA redirect receiver for GitHub Pages (spa-github-pages pattern) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Backwards-compat: redirect old hash routes to path routes -->
    <script>
      (function() {
        var hash = window.location.hash;
        if (hash.startsWith('#/')) {
          window.location.replace(
            window.location.pathname + hash.slice(1) + window.location.search
          );
        }
      })();
    </script>
