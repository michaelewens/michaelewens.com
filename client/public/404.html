<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Michael Ewens</title>
  <script>
    var l = window.location;
    // Saved or shared links with a trailing slash (/research/) go straight to the real page (/research).
    if (l.pathname.length > 1 && l.pathname.slice(-1) === '/') {
      l.replace(l.pathname.replace(/\/+$/, '') + l.search + l.hash);
    } else {
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }
  </script>
</head>
<body style="font-family: sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem;">
  <h1>Page not found</h1>
  <p>
    <a href="/">Home</a> ·
    <a href="/about">About</a> ·
    <a href="/research">Research</a> ·
    <a href="/cv">CV</a> ·
    <a href="/data-code">Data &amp; Code</a> ·
    <a href="/projects">Projects</a> ·
    <a href="/teaching">Teaching</a> ·
    <a href="/media">Media</a> ·
    <a href="/contact">Contact</a>
  </p>
</body>
</html>
